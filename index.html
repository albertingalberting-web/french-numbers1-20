<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les nombres 1–20 · Type it</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--panel:#fff;--ink:#14213d;--mute:#5b6784;--line:#d3dbe9;--blue:#1d3fa0;--red:#d62839;--okbg:#dff3e7;--ok:#17703f;--badbg:#fbe0e3;--bad:#a5192a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1630;--panel:#16224a;--ink:#eaf0ff;--mute:#9fb0d8;--line:#2a3a6b;--blue:#7da0ff;--red:#ff6b7a;--okbg:#12402a;--ok:#7fe0a8;--badbg:#4a1b25;--bad:#ff9aa6}}
:root[data-theme="dark"]{--bg:#0d1630;--panel:#16224a;--ink:#eaf0ff;--mute:#9fb0d8;--line:#2a3a6b;--blue:#7da0ff;--red:#ff6b7a;--okbg:#12402a;--ok:#7fe0a8;--badbg:#4a1b25;--bad:#ff9aa6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 clamp(28px,7vw,40px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 6px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.detail{text-align:center;margin-bottom:16px}
.detail .word{font:800 clamp(40px,12vw,64px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--blue)}
.detail .say{color:var(--mute);margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:520px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 4px;cursor:pointer;color:var(--ink);font:inherit;text-align:center}
.tile b{display:block;font:800 24px/1.2 "Bricolage Grotesque",system-ui,sans-serif}
.tile span{font-size:13px;color:var(--mute)}
.tile[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.tip{margin-top:16px;color:var(--mute);font-size:15px}
.tip b{color:var(--ink)}
.q{text-align:center}
.num{font:800 clamp(72px,24vw,120px)/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--red);margin:4px 0 12px}
.lab{display:block;color:var(--mute);margin-bottom:8px}
input{width:100%;font:600 24px system-ui,sans-serif;text-align:center;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.fb{min-height:56px;margin:12px 0;padding:10px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 6px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.primary,.ghost{font:inherit;font-weight:700;border-radius:10px;padding:12px 20px;cursor:pointer;border:2px solid var(--blue)}
.primary{background:var(--blue);color:#fff;width:100%}
:root:not([data-theme="light"]) .primary{color:#0d1630}
.ghost{background:none;color:var(--blue)}
.big{font-size:20px;padding:18px 24px;margin:12px 0 20px}
.stats{display:flex;justify-content:space-between;color:var(--mute);font-size:15px;margin-top:14px}
.gif{max-width:100%;border-radius:12px;display:block;margin:0 auto 12px}h2{font:800 24px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}.stats{flex-wrap:wrap;gap:4px 12px}.copy{margin-top:32px;text-align:center;color:var(--mute);font-size:14px}.foot{max-width:640px;margin:0 auto;padding:0 16px 28px;text-align:center;color:var(--mute);font-size:14px}.copy{margin-top:32px;text-align:center;color:var(--mute);font-size:14px}.weak{margin-top:10px;color:var(--mute);font-size:15px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Les nombres 1–20</h1>
  <p class="sub">Type each number in French.</p>
  <div id="view"></div>
  <div class="stats" id="stats" hidden></div>
  <div class="weak" id="weak"></div>
  <footer class="copy">Copyright © Albert Ting 2026.10</footer>
</main>
<script>
const W=[["un","uh~","/œ̃/"],["deux","duh (round your lips)","/dø/"],["trois","trwah","/tʁwa/"],["quatre","katr","/katʁ/"],["cinq","seh~k","/sɛ̃k/"],["six","seess","/sis/"],["sept","set","/sɛt/"],["huit","weet (round your lips)","/ɥit/"],["neuf","nuhf","/nœf/"],["dix","deess","/dis/"],["onze","o~z","/ɔ̃z/"],["douze","dooz","/duz/"],["treize","trez","/tʁɛz/"],["quatorze","ka-torz","/katɔʁz/"],["quinze","keh~z","/kɛ̃z/"],["seize","sez","/sɛz/"],["dix-sept","dee-set","/disɛt/"],["dix-huit","dee-zweet","/dizɥit/"],["dix-neuf","deez-nuhf","/diznœf/"],["vingt","veh~","/vɛ̃/"]];
function noFr(){try{const v=speechSynthesis.getVoices();return v.length>0&&!v.some(x=>/^fr/i.test(x.lang))}catch(e){return false}}
const $=s=>document.querySelector(s);
let done=new Set(),mode="type",cur=null,answered=false,sel=1,miss={},st={ok:0,bad:0,streak:0,best:0};
try{const s=JSON.parse(localStorage.getItem("fr20")||"null");if(s){miss=s.miss||{};st.best=s.best||0}}catch(e){}
function save(){try{localStorage.setItem("fr20",JSON.stringify({miss:miss,best:st.best}))}catch(e){}}
const canSpeak="speechSynthesis" in window;
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("fr"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\s_\u2010-\u2015-]+/g,"-").replace(/^-|-$/g,"")}
function pick(){let c=[];for(let n=1;n<=20;n++)if(!done.has(n)&&n!==cur)c.push(n);if(!c.length)for(let n=1;n<=20;n++)if(!done.has(n))c.push(n);if(!c.length)c=[1];let tot=0;const w=c.map(n=>{const x=1+2*(miss[n]||0);tot+=x;return x});let r=Math.random()*tot;for(let i=0;i<c.length;i++){r-=w[i];if(r<=0)return c[i]}return c[0]}
function reset(){done=new Set();st.ok=0;st.bad=0;st.streak=0}

function ask(){cur=pick();answered=false;drawPractice();if(mode==="listen")speak(W[cur-1][0])}
function drawPractice(){
  const L=mode==="listen";
  $("#view").innerHTML=`<div class="card q">
    ${L?'<button class="ghost big" id="rep">Play again</button>':`<div class="num">${cur}</div>`}
    <label class="lab" for="ans">${L?"Type the number you hear":"Type it in French"}</label>
    <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${L?'inputmode="numeric"':""}>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="primary" id="go">Check</button></div>`;
  const inp=$("#ans");inp.focus();
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
  $("#go").onclick=go;
  const r=$("#rep");if(r)r.onclick=()=>{speak(W[cur-1][0]);inp.focus()};
  showStats();
}
function go(){
  if(answered){if(done.size===20){celebrate();return}ask();return}
  const inp=$("#ans"),v=inp.value.trim();if(!v)return;
  const w=W[cur-1][0],L=mode==="listen";
  const ok=L?(/^\d+$/.test(v)&&+v===cur):norm(v)===norm(w);
  answered=true;inp.readOnly=true;
  const fb=$("#fb");fb.className="fb "+(ok?"ok":"bad");
  fb.innerHTML=ok?`Oui ! <b>${cur} = ${w}</b> &nbsp; ${W[cur-1][2]}`:(L?`Not quite. You heard <b>${w}</b>, which is <b>${cur}</b>.`:`Not quite. ${cur} is <b>${w}</b> ${W[cur-1][2]}.`);
  if(ok){st.ok++;st.streak++;if(st.streak>st.best)st.best=st.streak;if(miss[cur]>0)miss[cur]--;done.add(cur)}
  else{st.bad++;st.streak=0;miss[cur]=(miss[cur]||0)+1;done.delete(cur)}
  save();$("#go").textContent=done.size===20?"Finish":"Next";showStats();
}
function showStats(){
  const s=$("#stats");s.hidden=false;
  s.innerHTML=`<span>Right: ${done.size} of 20</span><span>Streak: ${st.streak}</span><span>Best: ${st.best}</span>`;
  const weak=Object.keys(miss).filter(n=>miss[n]>0).sort((a,b)=>miss[b]-miss[a]);
  $("#weak").textContent=weak.length?"Practising more: "+weak.map(n=>n+" ("+W[n-1][0]+")").join(", "):"";
}

function celebrate(){
  $("#stats").hidden=true;$("#weak").textContent="";
  const tot=st.ok+st.bad,acc=tot?Math.round(100*st.ok/tot):100;
